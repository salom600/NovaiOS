[package]
name        = "novai-launcher"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
description = "NovaiOS launcher + one-click software store (iced UI)"
publish     = false

[[bin]]
name = "novai-launcher"
path = "src/main.rs"

[features]
default = []              # headless catalog print
gui     = ["iced", "tokio"]

[dependencies]
anyhow             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

iced  = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
