[package]
name        = "novai-comp"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
description = "NovaiOS Wayland compositor (built on Smithay)"
publish     = false

[[bin]]
name = "novai-comp"
path = "src/main.rs"

[features]
default = []                  # stub renderer — works without GPU deps
real-gpu = ["smithay", "wayland-client", "xkbcommon", "image"]

[dependencies]
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
nix                = { workspace = true }
libc               = { workspace = true }
clap               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }

# GPU-only deps — behind the `real-gpu` feature flag
smithay       = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
xkbcommon     = { workspace = true, optional = true }
image         = { workspace = true, optional = true }
