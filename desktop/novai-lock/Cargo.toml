[package]
name        = "novai-lock"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
description = "NovaiOS lock screen + login greeter (iced)"
publish     = false

[[bin]]
name = "novai-lock"
path = "src/main.rs"

[features]
default = []        # headless (prints user list + waits for SIGTERM)
gui     = ["iced", "tokio", "sha2", "hex"]

[dependencies]
anyhow             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
nix                = { workspace = true }

iced  = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "process"] }
sha2  = { workspace = true, optional = true }
hex   = { workspace = true, optional = true }
