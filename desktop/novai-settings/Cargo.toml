[package]
name        = "novai-settings"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
description = "NovaiOS system settings GUI (iced)"
publish     = false

[[bin]]
name = "novai-settings"
path = "src/main.rs"

[features]
default = []        # headless (print info)
gui     = ["iced", "tokio"]

[dependencies]
anyhow             = { workspace = true }
serde              = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

iced  = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "fs", "io-util"] }
