# =============================================================================
# NovaiOS — Continuous build status & nightly release.
# -----------------------------------------------------------------------------
# Every night at 04:00 UTC (after the weekly build-iso.yml has had time to run):
#   1. Check if build-iso.yml succeeded in the last 24h.
#   2. If yes, tag a `nightly-YYYYMMDD` release with the ISO.
# This is what makes NovaiOS feel continuously delivered.
# =============================================================================
name: nightly

on:
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions:  read

jobs:
  nightly:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Find latest successful build-iso run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DATE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          RUN=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-iso.yml/runs?status=success&created=>=$DATE&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')
          if [[ -z "$RUN" ]]; then
            echo "No successful build-iso run in the last 24h, skipping."
            echo "has_run=false" >> $GITHUB_OUTPUT
          else
            echo "Found run: $RUN"
            echo "run_id=$RUN" >> $GITHUB_OUTPUT
            echo "has_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Download ISO from successful run
        if: steps.find.outputs.has_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          # Find the novai-iso artifact
          ART=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.find.outputs.run_id }}/artifacts" \
            | jq -r '.artifacts[] | select(.name=="novai-iso") | .id')
          if [[ -z "$ART" ]]; then
            echo "novai-iso artifact not found"; exit 1
          fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o out/novai-iso.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART/zip"
          cd out && unzip novai-iso.zip && ls -la

      - name: Tag and publish nightly release
        if: steps.find.outputs.has_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: nightly-${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh release delete $TAG --yes --cleanup-tag 2>/dev/null || true
          gh release create $TAG \
            --title "NovaiOS Nightly ($DATE)" \
            --notes "Automated nightly build. Artifacts expire in 30 days." \
            --prerelease \
            out/*.iso out/*.sha256
