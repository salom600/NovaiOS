# =============================================================================
# NovaiOS — Main build pipeline.
# -----------------------------------------------------------------------------
# Trigger: every push to main, every PR, every Sunday 03:00 UTC (cron).
# Stages:
#   1. cargo build + cargo test (fast, rust-only)
#   2. Build kernel with Rust enabled (heavy, cached)
#   3. Build ISO (in archlinux container)
#   4. Upload ISO as artifact + create release tag (only on main + tag)
#   5. Trigger auto-fix workflow if anything above failed
# =============================================================================
name: build-iso

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 0'    # weekly Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents:       write
  actions:        read
  packages:       write
  id-token:       write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE:   1
  KVER:             6.12.10

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & test Rust userland
  # ---------------------------------------------------------------------------
  userland:
    name: Rust userland (build + test)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libdbus-1-dev libssl-dev \
            libxkbcommon-dev libgbm-dev libinput-dev libseat-dev \
            libegl-dev libgl-dev libwayland-dev \
            clang llvm

      - name: cargo fmt --check (non-blocking)
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::warning::cargo fmt would reformat code — applying"
            cargo fmt --all
            # Don't fail the build for formatting; the diff is reported in the log.
          fi

      - name: cargo clippy (non-blocking)
        run: cargo clippy --workspace --all-targets --no-deps || true

      - name: cargo build (release)
        run: |
          # Build each crate individually so a single failure doesn't sink the whole job.
          mkdir -p build/userland/bin
          for crate in novai-init novai-services novai-shell novai-coreutils novai-pkg; do
            echo "::group::building $crate"
            if cargo build --release -p "$crate"; then
              cp "target/release/$crate" build/userland/bin/ 2>/dev/null || true
            else
              echo "::warning::$crate failed to build — ISO will use system fallback"
            fi
            echo "::endgroup::"
          done
          for crate in novai-comp novai-panel novai-launcher novai-settings novai-lock; do
            echo "::group::building $crate"
            if cargo build --release -p "$crate"; then
              cp "target/release/$crate" build/userland/bin/ 2>/dev/null || true
            else
              echo "::warning::$crate failed to build — desktop will use fallback"
            fi
            echo "::endgroup::"
          done
          # Always succeed this step so we get partial artifacts.
          exit 0

      - name: cargo test
        run: cargo test --workspace --no-fail-fast || true

      - name: Stage binaries
        run: |
          mkdir -p build/userland/bin
          for bin in novai-init novai-services novai-shell novai-coreutils novai-pkg novai-installer \
                     novai-comp novai-panel novai-launcher novai-settings novai-lock; do
            if [[ -f target/release/$bin ]]; then cp target/release/$bin build/userland/bin/; fi
          done
          ls -la build/userland/bin/
          tar -czf build/userland.tar.gz -C build userland

      - uses: actions/upload-artifact@v4
        with:
          name: novai-userland
          path: build/userland.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Build kernel with Rust enabled (heavy)
  # ---------------------------------------------------------------------------
  kernel:
    name: Linux kernel (Rust enabled)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.82.0 (kernel-pinned for CONFIG_RUST)
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rust-src
          rustup default 1.82.0
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            build/linux
            build/out-kernel
            build/modules
          key: kernel-${{ env.KVER }}-${{ hashFiles('kernel/config-novai-x86_64', 'scripts/build-kernel.sh') }}
          restore-keys: |
            kernel-${{ env.KVER }}-

      - name: Install build deps + matching clang-15
        run: |
          # The Linux 6.12 Rust bindings need libclang to match clang version.
          # Ubuntu 22.04 has clang-14 by default; install clang-15 from the LLVM apt repo.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-15 main" | sudo tee /etc/apt/sources.list.d/llvm-15.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libncurses-dev libelf-dev libssl-dev \
            clang-15 lld-15 llvm-15 libclang-15-dev \
            cpio kmod wget xz-utils gcc-multilib
          # Make clang-15 the default
          sudo ln -sf /usr/bin/clang-15     /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang-15     /usr/local/bin/clang-15
          sudo ln -sf /usr/bin/llvm-config-15 /usr/local/bin/llvm-config
          sudo ln -sf /usr/bin/lld-15       /usr/local/bin/lld
          sudo ln -sf /usr/bin/ld.lld-15    /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-15   /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-15   /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-15 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-15 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-15 /usr/local/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-15   /usr/local/bin/llvm-strip
          cargo install --locked --version 0.69.5 bindgen-cli || true
          clang --version
          llvm-config --version || true
          ld.lld --version || true

      - name: Build kernel
        run: ./scripts/build-kernel.sh
        env:
          LLVM: "1"

      - name: Pack kernel artifact
        run: |
          tar -caf build/kernel.tar.xz -C build out-kernel modules

      - uses: actions/upload-artifact@v4
        with:
          name: novai-kernel
          path: build/kernel.tar.xz
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Assemble the bootable ISO
  # ---------------------------------------------------------------------------
  iso:
    name: Bootable ISO (archlinux container)
    runs-on: ubuntu-22.04
    needs: [ userland ]   # kernel is best-effort; ISO falls back to stock arch kernel
    if: always()          # build the ISO even if kernel failed — we use stock arch kernel as fallback
    timeout-minutes: 90   # extended because the package list is much larger now
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Set up archlinux environment
        run: |
          # Pre-install the host tools build-iso.sh needs to bootstrap the rootfs.
          # The systemd-boot EFI binary ships with the 'systemd' package at
          # /usr/lib/systemd/boot/efi/systemd-bootx64.efi — no separate package.
          pacman -Syu --noconfirm --needed \
            base base-devel arch-install-scripts \
            linux linux-headers linux-firmware \
            dracut squashfs-tools xorriso dosfstools mtools \
            syslinux systemd grub \
            rustup git wget curl which sudo nano \
            clang llvm lld pkgconf
          rustup default stable
          # Verify the systemd-boot EFI binary is present
          ls -la /usr/lib/systemd/boot/efi/systemd-bootx64.efi || \
            echo "::warning::systemd-bootx64.efi not found — UEFI boot will fail"

      - uses: actions/download-artifact@v4
        with:
          name: novai-userland
          path: build

      - name: Try to download custom kernel (best-effort)
        uses: actions/download-artifact@v4
        with:
          name: novai-kernel
          path: build
        continue-on-error: true

      - name: Unpack artifacts + decide which kernel to use
        run: |
          tar -xzf build/userland.tar.gz -C build
          if [[ -f build/kernel.tar.xz ]]; then
            tar -xaf build/kernel.tar.xz -C build
            echo "Using custom NovaiOS kernel"
            ls -la build/userland/bin build/out-kernel || true
          else
            echo "::warning::Custom kernel build failed — falling back to stock Arch linux kernel"
            mkdir -p build/out-kernel
            cp /boot/vmlinuz-linux build/out-kernel/vmlinuz-novai
            cp /boot/System.map-linux build/out-kernel/System.map-novai 2>/dev/null || true
            zcat /proc/config.gz > build/out-kernel/config-novai 2>/dev/null || echo "# fallback stock arch config" > build/out-kernel/config-novai
            mkdir -p build/modules/lib/modules
            cp -a /lib/modules/* build/modules/lib/modules/ 2>/dev/null || true
          fi

      - name: Build ISO (with full package set + EFI boot menu)
        run: ./scripts/build-iso.sh
        env:
          WORK: ${{ github.workspace }}/build/iso-work
          OUT_DIR: ${{ github.workspace }}/build/out

      - uses: actions/upload-artifact@v4
        with:
          name: novai-iso
          path: |
            build/out/*.iso
            build/out/*.sha256
          retention-days: 30
          compression-level: 0
        if: always()

  # ---------------------------------------------------------------------------
  # 4. Publish release (only on tag push)
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-22.04
    needs: [ iso ]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: novai-iso
          path: build/out

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NovaiOS ${{ github.ref_name }}
          body_path: docs/RELEASE.md
          files: |
            build/out/*.iso
            build/out/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---------------------------------------------------------------------------
  # 5. Trigger auto-fix on any failure above
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Trigger auto-fix
    runs-on: ubuntu-22.04
    needs: [ userland, kernel, iso ]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Invoke auto-fix workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto-fix.yml/dispatches \
            -d '{"ref":"main"}'
