[Unit]
Description=Getty on %i
After=systemd-user-sessions.service
After=network.target

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin novai --noclear %I $TERM
Type=idle
Restart=always
RestartSec=0
UtmpIdentifier=%I
TTYPath=/dev/%I
TTYReset=yes
TTYVHangup=yes
KillMode=process
IgnoreSIGPIPE=no
SendSIGHUP=yes

[Install]
WantedBy=multi-user.target
